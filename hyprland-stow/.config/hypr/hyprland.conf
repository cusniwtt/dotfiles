# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

#autogenerated = 1 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=DP-1,1920x1080@100,0x0,1
monitor=DP-2,1920x1080@100,0x0,1
#monitor=DP-3,1920x1080@60,-1080x-200,1,transform,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/windowsrule.conf
source = ~/.config/hypr/workspace.conf
source = ~/.config/hypr/keybinding.conf
source = ~/.config/hypr/autostart.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us, th
    kb_variant =
    kb_model =
    kb_options = grp:ctrl_space_toggle
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }
    
    accel_profile = flat
    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 3
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(235574fc)
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    #allow_tearing = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 5
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        range = 4
        render_power = 3
    }
    
}

group {
    col.border_active = rgba(235574fc)
    col.border_inactive = rgba(1e1e1efc)
    col.border_locked_active = rgba(c43f00fc)
    col.border_locked_inactive = rgba(1e1e1efc)
    groupbar {
        font_size = 15
        col.active = rgba(235574fc)
        col.inactive = rgba(1e1e1efc)
        col.locked_active = rgba(c43f00fc)
        col.locked_inactive = rgba(1e1e1efc)
        gradients = true
        gradient_round_only_edges = false
        height = 28
        indicator_height = 0
        rounding = 0
        gradient_rounding = 0
        gaps_in = 0
        gaps_out = 0
    }
}

animations {
    enabled = yes
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    animation = windows, 1, 3, overshot
    animation = windowsIn, 1, 3, overshot, popin 80%
    animation = windowsOut, 1, 4, overshot, popin 80%
    animation = workspaces, 1, 2, default, slidefade 20%
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = false # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = true
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
}


