# Example windowrule v1
#windowrule = float,^(pavucontrol)$
# Example windowrule v2
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# All workspace is float; If want tiling, comment all this
#windowrulev2 = float, workspace:1
#windowrulev2 = float, workspace:2
#windowrulev2 = float, workspace:3
#windowrulev2 = float, workspace:4
#windowrulev2 = float, workspace:5

# Float by windows
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(waypaper)$
windowrulev2 = float, class:^(nwg-look)$
windowrulev2 = float, class:^(eog)$
windowrulev2 = float,class:^(steam)$,title:^(Steam - Self Updater)$
windowrulev2 = float,class:^(steam)$,title:^(Steam Settings)$

# Set windows will landing in workspace
#windowrulev2 = workspace 3, class:^(discord)$
#windowrulev2 = workspace 3, class:^(steam)$

# Set custom size for some windows not remember size
#windowrulev2 = size 50% 60%, class:^(kitty)$
#windowrulev2 = size 60% 70%, class:^(thunar)$

# FROM CACHYOS
# Float Necessary Windows
windowrulev2 = float,class:^(nemo)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = float,class:^(iwdgui)$
windowrule = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float, class:^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrulev2 = float,class:^(zenity)$
