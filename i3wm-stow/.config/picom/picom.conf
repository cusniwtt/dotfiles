#################################
# Shadows
#################################
shadow = false;
shadow-radius = 0;
shadow-opacity = 0.0;
shadow-offset-x = 0;
shadow-offset-y = 0;

#################################
# Transparency / Opacity
#################################
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
blur-background = false;
blur-background-fixed = false;
blur-method = "none";

#################################
# Animations (disabled)
#################################
# Disable any experimental animation backends
animation-stiffness = 0;
animation-window-mass = 0;
animation-dampening = 0;
animation = false;

#################################
# General
#################################
fading = false;        # No fade animation
fade-in-step = 0.0;
fade-out-step = 0.0;

vsync = false;
backend = "xrender";   # simple backend, no effects

unredir-if-possible = false;

